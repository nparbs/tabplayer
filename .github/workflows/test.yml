name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  online:
    # Converter and browser tests reach Songsterr and YouTube, which may rate-limit or block CI runners,
    # so a failure here is reported but does not fail the build.
    name: Converter + browser tests (needs internet)
    runs-on: ubuntu-latest
    needs: unit
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:convert
      - run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: /tmp/tabplayer-e2e/
          if-no-files-found: ignore
